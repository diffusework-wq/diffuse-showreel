<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="DIFFUSE.WORK — Ideas, in motion. An interactive glass type showreel." />
    <title>DIFFUSE.WORK — Showreel</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000000'/%3E%3Cpath d='M8 6h8a10 10 0 010 20H8z' fill='none' stroke='%23a8ceff' stroke-width='3'/%3E%3Cpath d='M12 10h4a6 6 0 010 12h-4z' fill='%235b8cfa'/%3E%3C/svg%3E" />
  </head>
  <body>
    <main id="experience" aria-label="DIFFUSE WORK interactive showreel">
      <div id="ambient-light" aria-hidden="true"><div class="ambient-halo"></div><div class="ambient-floor"></div></div>
      <canvas id="scene" aria-label="Animated layered glass letters: DIFFU / SE-WR transforming into SHOW / REEL"></canvas>
      <header class="masthead"><span class="brand">DIFFUSE<span class="brand-dot">.</span>WORK</span><span class="edition">MOTION / FORM / EXPERIMENT</span><span class="index">SELECTED WORK — 01</span></header>
      <div id="letter-labels" aria-hidden="true"></div>
      <section id="cinema" aria-label="Showreel video">
        <div class="cinema-meta"><span>DIFFUSE.WORK</span><span>SHOWREEL / IN MOTION</span></div>
        <div id="screen-frame"><div id="player"></div></div>
        <div class="water" aria-hidden="true"><div class="water-ripples"></div><div class="water-vignette"></div></div>
        <p id="video-status" role="status"></p>
        <button id="sound-toggle" type="button" hidden aria-label="開啟影片聲音">開啟聲音</button>
      </section>
      <footer class="footer"><span id="chapter">01 — DIFFUSE</span><div class="scroll-cue"><span id="instruction">HOVER TO DISCOVER · SCROLL TO EXPLORE</span><span class="scroll-line"></span></div><span id="progress-label">00 / 100</span></footer>
      <div class="progress-track" aria-hidden="true"><div id="progress-fill"></div></div>
      <p id="loading" role="status">FORMING IDEAS<span>…</span></p>
      <p id="fatal-error" role="alert" hidden></p>
      <output id="diagnostics" hidden></output>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
